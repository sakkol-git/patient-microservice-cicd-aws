# LoadBalancer — creates an AWS NLB on EKS.
# On local kind/minikube this falls back gracefully to NodePort.
# Cost warning: ~$0.028/hr on AWS. Delete with `kubectl delete -f k8s/` when done.
apiVersion: v1
kind: Service
metadata:
  name: patient-service
  namespace: medlogix
  labels:
    app: patient-service
spec:
  type: ClusterIP
  selector:
    app: patient-service
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8081
    - name: direct
      protocol: TCP
      port: 8081
      targetPort: 8081
