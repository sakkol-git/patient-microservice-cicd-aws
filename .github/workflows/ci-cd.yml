name: CI/CD — Build, Push & Deploy MedLogix

# ─── Triggers ─────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ─── Global env ───────────────────────────────────────────────────────────────
env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com

# ─── Permissions for OIDC ─────────────────────────────────────────────────────
# Keyless auth: no long-lived AWS_ACCESS_KEY_ID secret stored in GitHub
permissions:
  id-token: write   # Required for OIDC token exchange
  contents: read

jobs:

  # ─── Job 1: Build & test both services ──────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build patient-service
        run: |
          cd patient-service
          ./mvnw package -B

      - name: Build audit-service
        run: |
          cd audit-service
          ./mvnw package -B

  # ─── Job 2: Build Docker images & push to AWS ECR ───────────────────────────
  docker-push:
    name: Docker Build & Push to ECR
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only push on main branch merges, not on PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        # This action automatically authenticates Docker with your ECR registry
        # using the OIDC credentials — no passwords or tokens stored in GitHub

      - name: Build & push patient-service
        uses: docker/build-push-action@v5
        with:
          context: ./patient-service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/medlogix/patient-service:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/medlogix/patient-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push audit-service
        uses: docker/build-push-action@v5
        with:
          context: ./audit-service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/medlogix/audit-service:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/medlogix/audit-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./k8s
          file: ./k8s/gateway.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/medlogix/api-gateway:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/medlogix/api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 3: Deploy to EKS (manual approval gate) ────────────────────────────
  deploy-eks:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: docker-push
    # "production" environment has a required reviewer approval gate.
    # Set up: GitHub repo → Settings → Environments → New environment → "production"
    # Add a required reviewer so this job waits for human approval.
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.30.0"

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name medlogix-cluster

      - name: Substitute ECR image URIs in manifests
        run: |
          # Replace placeholders with real ECR URIs and commit SHA tag
          sed -i "s|<AWS_ACCOUNT_ID>|${{ secrets.AWS_ACCOUNT_ID }}|g" k8s/patient-service-deployment.yaml k8s/audit-service-deployment.yaml
          sed -i "s|<AWS_REGION>|${{ env.AWS_REGION }}|g" k8s/patient-service-deployment.yaml k8s/audit-service-deployment.yaml
          # Pin to exact git SHA for immutable, auditable deployments
          sed -i "s|medlogix/patient-service:latest|medlogix/patient-service:${{ github.sha }}|g" k8s/patient-service-deployment.yaml
          sed -i "s|medlogix/audit-service:latest|medlogix/audit-service:${{ github.sha }}|g" k8s/audit-service-deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/rabbitmq-service.yaml
          kubectl apply -f k8s/audit-service-service.yaml
          kubectl apply -f k8s/audit-service-deployment.yaml
          kubectl apply -f k8s/patient-service-service.yaml
          kubectl apply -f k8s/patient-service-deployment.yaml
          kubectl apply -f k8s/gateway.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/audit-service -n medlogix --timeout=180s
          kubectl rollout status deployment/patient-service -n medlogix --timeout=180s
          kubectl rollout status deployment/api-gateway -n medlogix --timeout=120s

      - name: Print Gateway URL
        run: |
          echo "=== MedLogix API Gateway URL ==="
          kubectl get svc api-gateway -n medlogix \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
          echo ""
